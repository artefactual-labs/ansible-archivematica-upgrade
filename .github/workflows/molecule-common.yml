---
name: Molecule common

on:
  pull_request:
    paths:
      - "defaults/**"
      - "meta/**"
      - "tasks/common/**"
      - "tasks/migrations/**"
      - "vars/**"
      - "molecule/common/**"
      - "molecule/shared/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/molecule-common.yml"
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  molecule-common:
    name: Molecule common (${{ matrix.platform.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: "ubuntu2404"
            make_target: "molecule-test-ubuntu2404"
          - name: "ubuntu2204"
            make_target: "molecule-test-ubuntu2204"
          - name: "rockylinux9"
            make_target: "molecule-test-rockylinux9"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run common Molecule scenario
        run: make ${{ matrix.platform.make_target }}

      - name: Capture common coverage summary
        if: always()
        run: |
          mkdir -p coverage
          if [ -f .ansible/molecule/common-task-coverage.jsonl ]; then
            make molecule-coverage \
              MOLECULE_COVERAGE_PLATFORM=${{ matrix.platform.name }} \
              > coverage/${{ matrix.platform.name }}-common-coverage.json
          fi

      - name: Upload common coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: molecule-${{ matrix.platform.name }}-common-coverage
          path: |
            coverage/${{ matrix.platform.name }}-common-coverage.json
            .ansible/molecule/common-task-coverage.jsonl
          if-no-files-found: ignore
          include-hidden-files: true
