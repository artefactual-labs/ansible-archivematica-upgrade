---
name: Molecule phases

on:
  pull_request:
    paths:
      - "defaults/**"
      - "meta/**"
      - "tasks/**"
      - "vars/**"
      - "molecule/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/molecule-phases.yml"
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover_phase_scenarios:
    name: Discover phase scenarios
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.phase_scenarios.outputs.scenarios }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover phase and migration scenarios
        id: phase_scenarios
        run: |
          scenarios="$(
            make --no-print-directory molecule-phase-scenarios |
              jq --raw-input --slurp --compact-output \
                'split("\n") | map(select(length > 0))'
          )"
          if [ "$scenarios" = "[]" ]; then
            printf '%s\n' "No phase or migration Molecule scenarios were discovered." >&2
            exit 1
          fi
          printf 'scenarios=%s\n' "$scenarios" >> "$GITHUB_OUTPUT"

  molecule-phase-scenario:
    name: Molecule phase (${{ matrix.platform.name }}, ${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    needs: discover_phase_scenarios
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: "ubuntu2404"
            make_target: "molecule-test-ubuntu2404"
          - name: "ubuntu2204"
            make_target: "molecule-test-ubuntu2204"
          - name: "rockylinux9"
            make_target: "molecule-test-rockylinux9"
        scenario: ${{ fromJSON(needs.discover_phase_scenarios.outputs.scenarios) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run phase and migration Molecule scenario
        run: |
          mkdir -p .ansible/molecule
          make ${{ matrix.platform.make_target }} \
            MOLECULE_SCENARIO="${{ matrix.scenario }}" \
            MOLECULE_COVERAGE_CONFIG=molecule/phase-coverage.yml \
            MOLECULE_COVERAGE_FILE="$GITHUB_WORKSPACE/.ansible/molecule/${{ matrix.platform.name }}-${{ matrix.scenario }}-task-coverage.jsonl" \
            MOLECULE_EPHEMERAL_DIRECTORY="$GITHUB_WORKSPACE/.ansible/molecule/ephemeral/${{ matrix.platform.name }}-${{ matrix.scenario }}" \
            MOLECULE_PLATFORM_NAME="${{ matrix.platform.name }}-instance"

      - name: Upload phase coverage scenario artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molecule-phase-coverage-${{ matrix.platform.name }}-${{ matrix.scenario }}
          path: .ansible/molecule/${{ matrix.platform.name }}-${{ matrix.scenario }}-task-coverage.jsonl
          if-no-files-found: ignore
          include-hidden-files: true

  molecule-phase-coverage:
    name: Molecule phase coverage (${{ matrix.platform.name }})
    runs-on: ubuntu-24.04
    needs: molecule-phase-scenario
    if: always()
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: "ubuntu2404"
            coverage_target: "molecule-phase-coverage-ubuntu2404"
          - name: "ubuntu2204"
            coverage_target: "molecule-phase-coverage-ubuntu2204"
          - name: "rockylinux9"
            coverage_target: "molecule-phase-coverage-rockylinux9"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Download phase coverage scenario artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: coverage/scenario-artifacts
          pattern: molecule-phase-coverage-${{ matrix.platform.name }}-*
          merge-multiple: true

      - name: Capture phase coverage summary
        run: |
          mkdir -p .ansible/molecule
          mkdir -p coverage
          if ! [ -d coverage/scenario-artifacts ] || ! find coverage/scenario-artifacts -name "*-task-coverage.jsonl" -print -quit | grep -q .; then
            printf '%s\n' "No ${{ matrix.platform.name }} phase coverage JSONL artifacts were downloaded." >&2
            exit 1
          fi
          find coverage/scenario-artifacts -name "*-task-coverage.jsonl" -exec cp {} .ansible/molecule/ \;
          make ${{ matrix.platform.coverage_target }} > coverage/${{ matrix.platform.name }}-phase-coverage.json

      - name: Upload phase coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molecule-${{ matrix.platform.name }}-phase-coverage
          path: |
            coverage/${{ matrix.platform.name }}-phase-coverage.json
            .ansible/molecule/${{ matrix.platform.name }}-*-task-coverage.jsonl
          if-no-files-found: ignore
          include-hidden-files: true
